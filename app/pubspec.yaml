name: masjid_namaz_app
description: "Masjid Management & Namaz Time App (Flutter + Riverpod + GoRouter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.0

  # Networking & Auth
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0

  # Local Persistence & Offline Cache
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Location, Sensors & Compass
  flutter_compass_v2: ^1.0.3
  geolocator: any

  # Audio & Adhan Alarms
  just_audio: ^0.9.36
  flutter_local_notifications: ^17.0.0

  # QR Code Scanning & Generation
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  # UI & Presentation
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
